# ──────────────────────────────────────────────────────────────────────
# Autonomous AI Agent - Docker Compose Configuration
# Auto-pull model on startup, fully automated
# ──────────────────────────────────────────────────────────────────────
# Services: Frontend (Next.js) + Backend (FastAPI) + LLM (Ollama)
# ──────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── LLM Service (Ollama) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-init.sh:/ollama-init.sh:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
      - AUTO_PULL_MODEL=hf.co/HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced:Q4_K_M
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        echo "═══════════════════════════════════════════════════════════"
        echo "  🤖 Ollama Started - Auto Pulling Model"
        echo "═══════════════════════════════════════════════════════════"
        echo "Model: $${AUTO_PULL_MODEL}"
        echo ""
        
        # Check if model already exists
        if ollama list 2>/dev/null | grep -q "HauhauCS"; then
            echo "✓ Model already exists - skipping pull"
        else
            echo "Pulling model (this may take 10-30 minutes on first run)..."
            ollama pull "$${AUTO_PULL_MODEL}"
            if [ $$? -eq 0 ]; then
                echo "✓ Model pulled successfully!"
            else
                echo "✗ Failed to pull model - you can pull manually later"
            fi
        fi
        
        echo ""
        echo "═══════════════════════════════════════════════════════════"
        echo "  ✅ Ollama is ready!"
        echo "═══════════════════════════════════════════════════════════"
        
        # Keep container running
        wait
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Backend (FastAPI + Agent) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${LLM_MODEL:-hf.co/HauhauCS/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced:Q4_K_M}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ubuntu:22.04}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-2g}
      - SANDBOX_CPU=${SANDBOX_CPU:-2.0}
      - COMMAND_TIMEOUT=${COMMAND_TIMEOUT:-60}
      - MAX_RETRIES=${MAX_RETRIES:-5}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  ollama_data:
    driver: local
