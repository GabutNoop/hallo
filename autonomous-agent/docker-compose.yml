# ──────────────────────────────────────────────────────────────────────
# Autonomous AI Agent - Docker Compose (Linux / Ubuntu)
# Services: Ollama (dolphin-llama3:8b) + Backend (FastAPI) + Frontend (Next.js)
# ──────────────────────────────────────────────────────────────────────

name: autonomous-agent

services:
  # ── LLM Service (Ollama) ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: agent-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    # GPU NVIDIA (opsional): butuh nvidia-container-toolkit terpasang
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Model puller: pull dolphin-llama3:8b sekali lalu exit ───────────
  model-puller:
    image: ollama/ollama:latest
    container_name: agent-model-puller
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL=${LLM_MODEL:-dolphin-llama3:8b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "==========================================================="
        echo "  Memastikan model tersedia: $${MODEL}"
        echo "==========================================================="
        if ollama list 2>/dev/null | grep -q "$${MODEL%%:*}"; then
          echo "Model sudah ada, lewati pull."
        else
          echo "Pull model (~4.7GB, bisa 5-30 menit tergantung koneksi)..."
          ollama pull "$${MODEL}" || { echo "Pull GAGAL - jalankan ./pull-model.sh manual"; exit 0; }
          echo "Model siap."
        fi
        ollama list
    restart: "no"

  # ── Backend (FastAPI + Agent + Docker SDK) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: autonomous-agent-backend:latest
    container_name: agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Wajib: backend membuat container sandbox lewat Docker daemon host
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${LLM_MODEL:-dolphin-llama3:8b}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-0}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ubuntu:22.04}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-2g}
      - SANDBOX_CPU=${SANDBOX_CPU:-2.0}
      - COMMAND_TIMEOUT=${COMMAND_TIMEOUT:-120}
      - MAX_RETRIES=${MAX_RETRIES:-5}
      - MAX_STEPS=${MAX_STEPS:-25}
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-5}
      - SEARCH_TIMEOUT=${SEARCH_TIMEOUT:-20}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend (Next.js) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_MODEL_NAME: ${LLM_MODEL:-dolphin-llama3:8b}
    image: autonomous-agent-frontend:latest
    container_name: agent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      - NEXT_PUBLIC_MODEL_NAME=${LLM_MODEL:-dolphin-llama3:8b}
    depends_on:
      backend:
        condition: service_started

volumes:
  ollama_data:
    driver: local
