<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hallo — AI Chatbot</title>
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="manifest" href="../../manifest.json">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Hallo</h2>
      <button onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme"><i class="ph ph-moon-stars"></i></button>
    </div>
    <button class="btn-primary" onclick="newChat()">+ New Chat</button>
    <nav class="chat-list" id="chatList"></nav>
    <div class="sidebar-footer">
      <span>Model: <strong id="modelName">gemma-4-31b-it-uncensored</strong></span>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <button onclick="toggleSidebar()" aria-label="Toggle sidebar"><i class="ph ph-list"></i></button>
      <h1>Hallo AI Assistant</h1>
      <div class="header-actions">
        <span class="status-dot" id="statusDot"></span>
        <button onclick="openSettings()" aria-label="Settings"><i class="ph ph-gear"></i></button>
      </div>
    </header>

    <section class="chat-area" id="chatArea"></section>

    <footer class="input-area">
      <textarea id="userInput" rows="1" placeholder="Ketik pesan..." onkeydown="handleKeyDown(event)"></textarea>
      <button onclick="sendMessage()" aria-label="Send"><i class="ph ph-paper-plane-right"></i></button>
    </footer>
  </main>

  <aside class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h3>Settings</h3>
      <button onclick="closeSettings()" aria-label="Close"><i class="ph ph-x"></i></button>
    </div>
    <div class="settings-body">
      <label>Temperature <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7"></label>
      <label>Max Tokens <input type="range" id="maxTokens" min="128" max="8192" step="128" value="2048"></label>
      <label>System Prompt <textarea id="systemPrompt" rows="3">You are a helpful AI assistant.</textarea></label>
      <label>Language <select id="languageSelect"><option value="id">Bahasa Indonesia</option><option value="en" selected>English</option></select></label>
      <button onclick="saveSettings()" class="btn-primary">Save</button>
    </div>
  </aside>
</div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/markdown.js"></script>
<script src="js/api.js"></script>
<script src="js/settings.js"></script>
<script src="js/history.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
